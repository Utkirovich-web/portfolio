    <!--
      Theme + language bootstrap. Runs synchronously before the first paint so the
      saved theme is applied immediately (no flash of the wrong theme).
      Keys and values must stay in sync with src/stores/theme.ts and src/plugins/i18n.ts.
    -->
    <script>
      ;(function () {
        var root = document.documentElement
        var colors = { light: '#FAFAFA', dark: '#0A0A0A', aurora: '#B8CFD0' }
        var prefersDark = function () {
          return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        }
        var theme = prefersDark() ? 'dark' : 'light'
        try {
          var saved = localStorage.getItem('sa-theme')
          if (saved === 'light' || saved === 'dark' || saved === 'aurora') theme = saved
          var lang = localStorage.getItem('sa-locale')
          if (lang === 'uz' || lang === 'en' || lang === 'ru') root.lang = lang
        } catch (e) {}
        root.setAttribute('data-theme', theme)
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', colors[theme])
      })()
    </script>
